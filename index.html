<body class="h-full bg-[#1a0a00] text-orange-50 overflow-hidden font-sans">
  <div id="root" class="h-full w-full"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script type="text/babel">
   const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================
    // 1. KONFIGURASI BACKEND GOOGLE APPS SCRIPT
    // =========================================================
    // Ganti URL di bawah dengan Web App URL dari Deployment GAS Anda
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzDETBAs3X_tR-U2MYd6IowQ6Q9AS9_4CGstcnLqidIFzTWIkmx3-_SMcPe1c7Jye0P/exec";

    // Jika file dibuka dari Google Apps Script, bridge ini tersedia dan tidak
    // membutuhkan CORS. Jika dibuka dari GitHub Pages, gunakan fetch ke Web App.
    const HAS_GAS_BRIDGE =
      typeof google !== "undefined" &&
      google.script &&
      google.script.run;

    function callGasBridge(action, payload) {
      const bridgeMethod = {
        getAssets: ["getSpreadsheetData", []],
        addOrUpdateAsset: ["addOrUpdateAssetGas", [payload.assetData || payload.data]],
        deleteAsset: ["deleteAssetGas", [payload.id]],
        addSOItem: ["saveStockOpnameDraftGas", [payload.data || []]],
        saveStockOpnameDraft: ["saveStockOpnameDraftGas", [payload.data || []]],
        releaseSOReport: ["releaseSOReport", [payload.data]],
        updateCompletedSO: ["updateCompletedSOGas", [payload.id, payload.periode, payload.lokasi]],
        deleteCompletedSO: ["deleteCompletedSOGas", [payload.id]],
        savePergerakanSO: ["savePergerakanSO", [payload.data]],
      }[action];

      if (!bridgeMethod) {
        return Promise.resolve({ success: false, error: `Aksi tidak dikenal: ${action}` });
      }

      return new Promise((resolve) => {
        const runner = google.script.run
          .withSuccessHandler((result) => resolve(result || { success: true }))
          .withFailureHandler((error) =>
            resolve({ success: false, error: error?.message || String(error) })
          );
        runner[bridgeMethod[0]](...bridgeMethod[1]);
      });
    }

    async function sendToGAS(action, payload = {}) {
      if (HAS_GAS_BRIDGE) {
        return callGasBridge(action, payload);
      }
      if (!GAS_URL || !GAS_URL.startsWith("https://script.google.com/")) {
        return { success: false, error: "GAS_URL belum dikonfigurasi." };
      }
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action, ...payload }),
        });
        if (!response.ok) throw new Error(`HTTP Status Error: ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error("Gagal terhubung ke Google Apps Script:", error);
        return { success: false, error: error.message || "Gagal terhubung ke server." };
      }
    }

    // =========================================================
    // 2. MASTER DATA (KATEGORI & LOKASI)
    // =========================================================
    const CATEGORIES = ["IT", "Furniture", "Mesin", "Kendaraan", "Elektronik", "Peralatan", "Lainnya", "Aset Lain"];
    const LOCATIONS = ["Finance", "HRD", "Ruang Server", "Marketing", "Gudang Utama", "Operasional", "Meeting Room", "Gudang"];

    // =========================================================
    // 3. HELPER FUNCTIONS & INITIAL STATES
    // =========================================================
    // Mengubah URL Google Drive biasa menjadi link thumbnail gambar yang bisa di-embed
    const convertDriveUrl = (url) => {
      if (!url) return "";
      const s = url.trim();
      if (s.includes("drive.google.com/thumbnail")) return s;
      const m1 = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (m1) return `https://drive.google.com/thumbnail?id=${m1[1]}&sz=w800`;
      const m2 = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m2) return `https://drive.google.com/thumbnail?id=${m2[1]}&sz=w800`;
      return s;
    };

    // Initial state di-set KOSONG agar data dimuat secara dinamis dari Google Sheets
    const INITIAL_ASSETS = [];
    const INITIAL_ACTIVE_SO = [];
    const INITIAL_COMPLETED_SO = [];

    // =========================================================
    // 4. UI COMPONENTS (OPTIMIZED)
    // =========================================================
    // Komponen Icon ringan tanpa useEffect berulang (mencegah performa lambat/lag)
    const Icon = ({ name, className = "h-5 w-5", ...props }) => {
      return (
        <span
          className={`inline-flex items-center justify-center ${className}`}
          dangerouslySetInnerHTML={{ __html: `<i data-lucide="${name}" class="h-full w-full"></i>` }}
          {...props}
        />
      );
    };

    // Dialog Konfirmasi Hapus/Aksi
    function ConfirmDialog({ isOpen, title, message, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
          <div className="bg-[#12324b] border border-[#1e5574] w-full max-w-sm rounded-2xl p-6 space-y-6">
            <div className="text-center space-y-2">
              <div className="h-12 w-12 bg-red-500/10 text-red-500 rounded-2xl flex items-center justify-center mx-auto">
                <Icon name="help-circle" className="h-6 w-6" />
              </div>
              <h4 className="font-extrabold text-sm text-white">{title}</h4>
              <p className="text-[11px] text-slate-400 leading-relaxed">{message}</p>
            </div>
            <div className="flex gap-2 text-xs">
              <button onClick={onCancel} className="flex-1 py-2.5 border border-slate-700 text-slate-300 rounded-xl font-bold hover:bg-slate-950/40">Batal</button>
              <button onClick={onConfirm} className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold shadow">Ya, Lanjutkan</button>
            </div>
          </div>
        </div>
      );
    }
    function CameraScanner({ onScanSuccess, scannerId = "reader", isActive, triggerToast }) {
      // permState: 'unknown' | 'checking' | 'prompt' | 'granted' | 'denied' | 'unavailable'
      const [permState, setPermState] = useState('unknown');
      const [isCameraActive, setIsCameraActive] = useState(false);
      const [isStarting, setIsStarting] = useState(false);
      const scannerRef = useRef(null);

      const stopScanner = () => {
        if (scannerRef.current) {
          scannerRef.current.stop().then(() => {
            scannerRef.current = null;
            setIsCameraActive(false);
            triggerToast("Kamera dinonaktifkan.");
          }).catch(() => {
            scannerRef.current = null;
            setIsCameraActive(false);
          });
        } else {
          setIsCameraActive(false);
        }
        setIsStarting(false);
      };

      // Launches Html5Qrcode after camera stream is confirmed available
      const launchScanner = () => {
        if (scannerRef.current) return;
        setIsCameraActive(true);
        try {
          const html5QrCode = new Html5Qrcode(scannerId);
          scannerRef.current = html5QrCode;
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 15, qrbox: (w, h) => ({ width: Math.min(w * 0.75, 260), height: Math.min(h * 0.75, 260) }) },
            (decodedText) => { onScanSuccess(decodedText); triggerToast(`✅ Terdeteksi: ${decodedText}`); },
            () => {}
          ).then(() => {
            setIsStarting(false);
            setPermState('granted');
          }).catch(err => {
            console.error("Html5Qrcode start error:", err);
            const msg = err && err.message ? err.message.toLowerCase() : '';
            if (msg.includes('permission') || msg.includes('notallowed') || msg.includes('denied')) {
              setPermState('denied');
              triggerToast("⛔ Izin kamera ditolak. Aktifkan di pengaturan browser.");
            } else {
              triggerToast("⚠️ Gagal memulai scanner. Coba lagi.");
            }
            scannerRef.current = null;
            setIsCameraActive(false);
            setIsStarting(false);
          });
        } catch (e) {
          console.error("Html5Qrcode init error:", e);
          scannerRef.current = null;
          setIsCameraActive(false);
          setIsStarting(false);
        }
      };

      // Request camera permission explicitly (requires user gesture for 'prompt' state)
      const requestAndStart = () => {
        if (isStarting || scannerRef.current) return;
        setIsStarting(true);
        triggerToast("Meminta izin kamera...");

        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setPermState('unavailable');
          setIsStarting(false);
          triggerToast("⚠️ Browser tidak mendukung akses kamera di konteks ini.");
          return;
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
          .then(stream => {
            // Permission granted — stop the test stream, let Html5Qrcode manage it
            stream.getTracks().forEach(t => t.stop());
            setPermState('granted');
            triggerToast("✅ Izin kamera diberikan. Memulai scanner...");
            setTimeout(() => launchScanner(), 300);
          })
          .catch(err => {
            console.error("getUserMedia error:", err);
            setIsStarting(false);
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
              setPermState('denied');
              triggerToast("⛔ Izin kamera ditolak. Aktifkan di pengaturan browser.");
            } else if (err.name === 'NotFoundError') {
              setPermState('unavailable');
              triggerToast("⚠️ Tidak ada kamera yang terdeteksi di perangkat ini.");
            } else {
              triggerToast(`⚠️ Gagal akses kamera: ${err.message}`);
            }
          });
      };

      // Check current permission state without triggering a dialog
      const checkPermission = () => {
        setPermState('checking');
        if (!window.isSecureContext || !navigator.mediaDevices) {
          setPermState('unavailable');
          return;
        }
        if (navigator.permissions && navigator.permissions.query) {
          navigator.permissions.query({ name: 'camera' })
            .then(result => {
              setPermState(result.state); // 'granted' | 'denied' | 'prompt'
              result.onchange = () => setPermState(result.state);
              if (result.state === 'granted') launchScanner();
            })
            .catch(() => {
              // Permissions API not available — try direct launch (will prompt browser dialog)
              setPermState('prompt');
            });
        } else {
          // Fallback: permissions API unavailable, need user gesture
          setPermState('prompt');
        }
      };

      // Auto-check & start saat tab aktif / dinonaktifkan
      useEffect(() => {
        if (isActive && !scannerRef.current && !isStarting) {
          checkPermission();
        } else if (!isActive) {
          stopScanner();
          setPermState('unknown');
        }
      }, [isActive]);

      // Cleanup menyeluruh saat komponen di-unmount (pindah halaman)
      useEffect(() => {
        return () => {
          // 1. Stop instance scanner library
          if (scannerRef.current) {
            scannerRef.current.stop().catch(() => {});
            scannerRef.current = null;
          }
          // 2. Paksa matikan semua stream kamera browser yang masih tersisa
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
              .then(stream => stream.getTracks().forEach(track => track.stop()))
              .catch(() => {});
          }
        };
      }, []);
      const simulateScan = () => {
        triggerToast("Menjalankan simulasi scan...");
        setTimeout(() => {
          const list = ["8806091234001","8806091234002","8806091234003","8806091234004","8806091234005","8806091234006","8806091234007","8806091234008","8806091234009","8806091234010"];
          const b = list[Math.floor(Math.random() * list.length)];
          onScanSuccess(b);
          triggerToast(`[Simulasi] Barcode: ${b}`);
        }, 800);
      };

      const renderOverlay = () => {
        if (isCameraActive) return null;

        if (permState === 'checking' || isStarting) {
          return (
            <div className="absolute inset-0 flex flex-col items-center justify-center p-6 space-y-3">
              <div className="h-12 w-12 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
              <p className="text-xs font-bold text-blue-300">Memeriksa izin kamera...</p>
            </div>
          );
        }

        if (permState === 'denied') {
          return (
            <div className="absolute inset-0 flex flex-col items-center justify-center p-6 space-y-4">
              <div className="h-14 w-14 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center text-red-400">
                <Icon name="camera-off" className="h-7 w-7" />
              </div>
              <div className="space-y-1">
                <p className="text-xs font-bold text-red-300">Izin Kamera Ditolak</p>
                <p className="text-[10px] text-slate-400 max-w-xs leading-relaxed">Buka <strong>Pengaturan Browser → Izin Situs → Kamera</strong> dan aktifkan untuk halaman ini, lalu muat ulang.</p>
              </div>
              <div className="flex flex-wrap gap-2 justify-center">
                <button onClick={requestAndStart} className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold flex items-center gap-2">
                  <Icon name="refresh-cw" className="h-3.5 w-3.5" /> Coba Lagi
                </button>
                <button onClick={simulateScan} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-xs font-bold flex items-center gap-2">
                  <Icon name="scan" className="h-3.5 w-3.5 text-amber-500" /> Simulasi
                </button>
              </div>
            </div>
          );
        }

        if (permState === 'unavailable') {
          return (
            <div className="absolute inset-0 flex flex-col items-center justify-center p-6 space-y-4">
              <div className="h-14 w-14 bg-amber-500/10 border border-amber-500/20 rounded-2xl flex items-center justify-center text-amber-400">
                <Icon name="alert-triangle" className="h-7 w-7" />
              </div>
              <div className="space-y-1">
                <p className="text-xs font-bold text-amber-300">Kamera Tidak Tersedia</p>
                <p className="text-[10px] text-slate-400 max-w-xs leading-relaxed">Perangkat tidak memiliki kamera atau browser tidak mendukung API kamera. Gunakan simulasi scan.</p>
              </div>
              <button onClick={simulateScan} className="px-5 py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold flex items-center gap-2">
                <Icon name="scan" className="h-4 w-4" /> Simulasi Scan
              </button>
            </div>
          );
        }

        // 'prompt' or 'unknown' — needs user gesture to trigger permission dialog
        return (
          <div className="absolute inset-0 flex flex-col items-center justify-center p-6 space-y-4">
            <div className="h-14 w-14 bg-blue-500/10 border border-blue-500/20 rounded-2xl flex items-center justify-center text-blue-400 shadow-lg">
              <Icon name="camera" className="h-8 w-8" />
            </div>
            <div className="space-y-1">
              <p className="text-xs font-bold text-slate-200">Izinkan Akses Kamera</p>
              <p className="text-[10px] text-slate-500 max-w-xs leading-relaxed">Ketuk tombol di bawah, lalu pilih <strong className="text-slate-300">Izinkan</strong> saat browser meminta akses kamera.</p>
            </div>
            <div className="flex flex-wrap gap-2 justify-center">
              <button onClick={requestAndStart} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-2 transition-all animate-pulse">
                <Icon name="video" className="h-4 w-4" /> Izinkan & Aktifkan Kamera
              </button>
              <button onClick={simulateScan} className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-xs font-bold shadow-md flex items-center gap-2 transition-all">
                <Icon name="scan" className="h-4 w-4 text-amber-500" /> Simulasi Scan
              </button>
            </div>
          </div>
        );
      };

      return (
        <div className="bg-[#12324b]/40 border border-[#1e5574]/60 rounded-2xl p-5 text-center space-y-4">
          <div className="flex items-center justify-between">
            <h3 className="text-xs font-extrabold text-white uppercase tracking-wider flex items-center gap-2">
              <span className={`h-2 w-2 rounded-full ${isCameraActive ? "bg-emerald-500 animate-ping" : permState === 'denied' ? "bg-red-500" : "bg-slate-500"}`}></span>
              Kamera Scanner
            </h3>
            {isCameraActive && (
              <button onClick={stopScanner} className="text-[10px] bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold px-3 py-1.5 rounded-lg border border-red-500/10 transition-all flex items-center gap-1.5">
                <Icon name="video-off" className="h-3 w-3" /> Matikan Kamera
              </button>
            )}
          </div>
          <div className="relative aspect-video max-w-md mx-auto bg-slate-950/70 rounded-xl overflow-hidden border border-[#1e5574]/40 flex flex-col items-center justify-center">
            <div id={scannerId} className="w-full h-full"></div>
            {renderOverlay()}
          </div>
          <div className="text-[10px] text-slate-500 max-w-md mx-auto">* Posisikan barcode tepat di tengah garis bidik kamera.</div>
          <button
            type="button"
            onClick={isCameraActive ? stopScanner : requestAndStart}
            disabled={isStarting}
            className={`w-full max-w-md mx-auto py-2.5 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 transition-all ${
              isCameraActive
                ? "bg-red-600/15 hover:bg-red-600/25 border border-red-500/30 text-red-300"
                : "bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20"
            } disabled:opacity-50`}
          >
            <Icon name={isCameraActive ? "video-off" : "scan-line"} className="h-4 w-4" />
            {isStarting ? "Menyiapkan Scanner..." : isCameraActive ? "Matikan Scanner" : "Scan Barcode"}
          </button>
        </div>
      );
    }

    function Sidebar({ activeTab, setActiveTab, isAdminLoggedIn, onLogoutClick, onOpenLoginModal, adminSubTab, setAdminSubTab, isAdminMenuExpanded, setIsAdminMenuExpanded, isMobileOpen, onCloseMobile }) {
      const MAIN_TABS = [
        { id: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
        { id: "stock-opname", label: "Stock Opname", icon: "clipboard-check" },
        { id: "scan-cek", label: "Scan Cek Aset", icon: "qr-code" }
      ];
      const ADMIN_ITEMS = [

    function StockOpnameView({ assets, activeSO, onAddSOItem, onDeleteSOItem, triggerToast, isActive, importedItems }) {
      const [inputBarcode, setInputBarcode] = useState("");
      const [inputQty, setInputQty] = useState(1);
      const [selectedLokasi, setSelectedLokasi] = useState(LOCATIONS[0]);
      const [selectedReference, setSelectedReference] = useState(null);

      const referenceItems = useMemo(() => {
        const seen = new Set();
        return (importedItems || [])
          .map(item => ({
            kodeBarang: String(item.kodeBarang || "").trim().replace(/\.0+$/, ""),
            namaBarang: String(item.namaBarang || "").trim(),
            satuan: String(item.satuan || "Pcs").trim() || "Pcs",
          }))
          .filter(item => {
            if (!item.kodeBarang || !item.namaBarang || seen.has(item.kodeBarang)) return false;
            seen.add(item.kodeBarang);
            return true;
          });
      }, [importedItems]);

      const referenceSuggestions = useMemo(() => {
        const query = inputBarcode.trim().toLowerCase();
        if (query.length < 2) return [];
        return referenceItems
          .filter(item =>
            item.kodeBarang.toLowerCase().includes(query) ||
            item.namaBarang.toLowerCase().includes(query)
          )
          .slice(0, 8);
      }, [inputBarcode, referenceItems]);

      const findReference = (value) => {
        const query = String(value || "").trim().toLowerCase();
        if (!query) return null;
        return referenceItems.find(item =>
          item.kodeBarang.toLowerCase() === query ||
          item.namaBarang.toLowerCase() === query
        ) || null;
      };

      const selectReference = (item) => {
        setSelectedReference(item);
        setInputBarcode(item.kodeBarang);
      };

      const handleBarcodeScanned = (barcode) => {
        const importedReference = findReference(barcode);
        if (importedReference) {
          selectReference(importedReference);
          onAddSOItem({
            barcode: importedReference.kodeBarang,
            namaAset: importedReference.namaBarang,
            lokasi: selectedLokasi,
            qty: inputQty
          });
          setInputBarcode("");
          setSelectedReference(null);
          setInputQty(1);
        } else {
          setInputBarcode(barcode);
          setSelectedReference(null);
          triggerToast("Kode hasil scan tidak ditemukan pada database Excel yang diimport.");
        }
      };

      const handleBarcodeChange = (value) => {
        setInputBarcode(value);
        setSelectedReference(findReference(value));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!inputBarcode.trim()) {
          triggerToast("Ketik minimal dua huruf untuk mencari barang atau gunakan Scan Barcode.");
          return;
        }
        const reference = selectedReference || findReference(inputBarcode);
        if (!reference) {
          triggerToast("Pilih referensi kode dan nama barang dari database Excel.");
          return;
        }
        onAddSOItem({
          barcode: reference.kodeBarang,
          namaAset: reference.namaBarang,
          lokasi: selectedLokasi,
          qty: inputQty
        });
        setInputBarcode("");
        setSelectedReference(null);
        setInputQty(1);
      };

      return (
        <div className="p-4 sm:p-6 md:p-8 space-y-6 md:space-y-8 max-w-7xl mx-auto">
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-5 space-y-6">
              <div className="bg-[#12324b]/30 border border-[#1e5574]/50 rounded-2xl p-6 space-y-4">
                <h3 className="text-xs font-extrabold text-white uppercase tracking-wider flex items-center gap-2"><Icon name="edit-3" className="h-4.5 w-4.5 text-blue-400" /> Pencatatan Fisik Opname</h3>
                <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Lokasi Audit</label>
                    <select value={selectedLokasi} onChange={(e) => setSelectedLokasi(e.target.value)} className="w-full bg-slate-900 border border-[#1e5574] rounded-xl px-4 py-3 focus:outline-none">
                      {LOCATIONS.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                    </select>
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Cari Kode / Nama Barang</label>
                    <div className="relative">
                      <input
                        type="text"
                        value={inputBarcode}
                        onChange={(e) => handleBarcodeChange(e.target.value)}
                        placeholder={referenceItems.length ? "Ketik minimal 2 huruf..." : "Import Excel terlebih dahulu"}
                        className="w-full bg-slate-900 border border-[#1e5574] rounded-xl pl-10 pr-4 py-3"
                        autoComplete="off"
                      />
                      <div className="absolute left-3.5 top-3.5 text-slate-500"><Icon name="barcode" className="h-4.5 w-4.5" /></div>
                    </div>
                    {inputBarcode.trim().length > 0 && inputBarcode.trim().length < 2 && (
                      <p className="text-[10px] text-slate-500">Ketik minimal dua huruf untuk menampilkan referensi.</p>
                    )}
                    {referenceSuggestions.length > 0 && (
                      <div className="max-h-56 overflow-y-auto rounded-xl border border-blue-500/30 bg-slate-950 shadow-xl divide-y divide-[#1e5574]/50">
                        {referenceSuggestions.map(item => (
                          <button
                            type="button"
                            key={item.kodeBarang}
                            onClick={() => selectReference(item)}
                            className="w-full text-left px-3 py-2.5 hover:bg-blue-500/10 transition-colors"
                          >
                            <span className="block text-[10px] font-mono font-bold text-blue-300">{item.kodeBarang}</span>
                            <span className="block text-[11px] font-semibold text-slate-200 truncate">{item.namaBarang}</span>
                          </button>
                        ))}
                      </div>
                    )}
                    {inputBarcode.trim().length >= 2 && referenceSuggestions.length === 0 && !selectedReference && (
                      <p className="text-[10px] text-amber-400">Referensi kode atau nama tidak ditemukan di file Excel.</p>
                    )}
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Nama Barang</label>
                    <div className="relative">
                      <input
                        type="text"
                        value={selectedReference?.namaBarang || ""}

                        placeholder="Nama barang terisi setelah referensi dipilih"
                        className="w-full bg-slate-950/70 border border-[#1e5574] rounded-xl pl-10 pr-4 py-3 text-slate-200"
                      />
                      <div className="absolute left-3.5 top-3.5 text-slate-500"><Icon name="package" className="h-4.5 w-4.5" /></div>
                    </div>
                    {referenceItems.length === 0 && (
                      <p className="text-[10px] text-amber-400">
                        Belum ada database Excel. Import file melalui Admin Data → Pergerakan SO.
                      </p>
                    )}
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Jumlah Kuantitas Fisik (Qty)</label>
                    <div className="relative">
                      <input type="number" min="1" value={inputQty} onChange={(e) => setInputQty(parseInt(e.target.value) || 1)} className="w-full bg-slate-900 border border-[#1e5574] rounded-xl pl-10 pr-4 py-3 font-mono font-bold" />
                      <div className="absolute left-3.5 top-3.5 text-slate-500"><Icon name="hash" className="h-4.5 w-4.5" /></div>

                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2"><Icon name="plus" className="h-4 w-4" /> Tambah ke Daftar Opname</button>
                </form>

              <CameraScanner onScanSuccess={handleBarcodeScanned} scannerId="so-camera" isActive={isActive} triggerToast={triggerToast} />

                            </td>
                            <td className="py-3 px-4 font-mono font-bold text-slate-300">{item.qty}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
              {activeSO.length > 0 && <div className="pt-4 border-t border-[#1e5574]/40 text-[10px] text-slate-500 flex items-center gap-1.5"><Icon name="info" className="h-3.5 w-3.5 text-blue-400 shrink-0" /> Sesi input tersinkronisasi otomatis dengan server spreadsheet.</div>}
            </div>
          </div>
        </div>
      );
    }

    function ScanCekAsetView({ assets, isActive, triggerToast }) {
      const [search, setSearch] = useState("");
      const [matched, setMatched] = useState(null);
      const [hasSearched, setHasSearched] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      const cleanBarcode = (val) => {
        if (val === null || val === undefined) return "";
        let s = val.toString().trim().toLowerCase();
        
        // Strip single quote prefix if any
        if (s.indexOf("'") === 0) {
          s = s.substring(1);
        }
        
        // Remove .0 suffix often added by spreadsheets
        if (s.indexOf(".") !== -1) {
          let parts = s.split(".");
          if (parts[1] === "0" || parts[1] === "") {
            s = parts[0];
          }
        }
        
        // Handle scientific notation e.g., 8.80609e+12
        if (s.indexOf("e") !== -1) {
          let num = Number(val);
          if (!isNaN(num)) {
            s = num.toFixed(0);
          }
        }
        
        return s;
      };

      const performSearch = (code) => {
        setErrorMsg("");
        if (!code || !code.trim()) {
          setErrorMsg("Silakan masukkan kode aset atau nomor barcode.");
          setMatched(null);
          setHasSearched(false);
          return;
        }
        setHasSearched(true);
        const term = cleanBarcode(code);
        const assetList = assets || [];
        const found = assetList.find(a => {
          if (!a) return false;
          const barcode = cleanBarcode(a.barcode);
          const kodeAset = cleanBarcode(a.kodeAset);
          return barcode === term || kodeAset === term || barcode.includes(term) || kodeAset.includes(term);
        });
        setMatched(found || "NOT_FOUND");
      };

      return (
        <div className="p-4 sm:p-6 md:p-8 space-y-6 md:space-y-8 max-w-5xl mx-auto">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-6">
              <form onSubmit={(e) => { e.preventDefault(); performSearch(search); }} className="bg-[#12324b]/30 border border-[#1e5574]/50 rounded-2xl p-6 space-y-4">
                <h3 className="text-xs font-extrabold text-white uppercase tracking-wider flex items-center gap-2"><Icon name="search" className="h-4.5 w-4.5 text-blue-400" /> Cari Informasi Aset</h3>
                <div className="space-y-1.5 text-xs">
                  <label className="text-[10px] font-bold text-slate-400 uppercase">Barcode / ID Kode Aset</label>
                  <div className="flex gap-2">
                    <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Masukkan barcode..." className="flex-1 bg-slate-900 border border-[#1e5574] rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none" />
                    <button type="submit" className="px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold">Cari</button>
                  </div>
                </div>
                {errorMsg && (
                  <div className="p-3 bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl text-xs flex items-center gap-2">
                    <Icon name="alert-circle" className="h-4 w-4 text-red-400 shrink-0" />
                    <span>{errorMsg}</span>
                  </div>
                )}
                {hasSearched && <button type="button" onClick={() => { setSearch(""); setMatched(null); setHasSearched(false); setErrorMsg(""); }} className="w-full py-2 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold">Bersihkan</button>}
              </form>
              <CameraScanner onScanSuccess={(b) => { setSearch(b); performSearch(b); }} scannerId="check-camera" isActive={isActive} triggerToast={triggerToast || (() => {})} />
            </div>

            {!hasSearched ? (
              <div className="bg-[#12324b]/15 border border-[#1e5574]/40 rounded-2xl p-6 flex flex-col justify-center min-h-[300px] text-center space-y-3">
                <div className="h-14 w-14 bg-blue-500/10 border border-blue-500/20 rounded-2xl flex items-center justify-center text-blue-400 mx-auto"><Icon name="scan-line" className="h-8 w-8 animate-pulse" /></div>
                <h4 className="text-sm font-extrabold text-slate-200">Menunggu Pemindaian</h4>
                <p className="text-[11px] text-slate-500 max-w-xs mx-auto">Gunakan kamera pemindai di sebelah kiri atau ketik manual untuk mencari informasi legal aset.</p>
              </div>
            ) : matched && matched !== "NOT_FOUND" ? (
              <div className="bg-[#12324b]/15 border border-[#1e5574]/40 rounded-2xl p-6 space-y-6">
                <div className="flex items-start justify-between border-b border-[#1e5574]/40 pb-4">
                  <div className="space-y-1">
                    <span className="px-2 py-0.5 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded text-[9px] font-mono font-bold">{matched.kategori || "Umum"}</span>
                    <h4 className="text-base font-black text-white">{matched.namaAset || "-"}</h4>
                    <p className="text-[10px] text-slate-500 font-mono">{(matched.kodeAset || "-")} • Barcode {(matched.barcode || "-")}</p>
                  </div>
                  <span className={`px-3 py-1 rounded-lg text-[10px] font-bold ${matched.status === "Aktif" ? "bg-emerald-500/10 text-emerald-400 border border-emerald-500/15" : matched.status === "Rusak" ? "bg-red-500/10 text-red-400 border border-red-500/15" : "bg-slate-500/10 text-slate-400 border border-slate-500/15"}`}>{matched.status || "Tidak Aktif"}</span>
                </div>
                {matched.fotoUrl && (
                  <div className="rounded-xl overflow-hidden border border-[#1e5574]/50 bg-slate-950/40 flex items-center justify-center" style={{maxHeight:"220px"}}>
                    <img
                      src={convertDriveUrl(matched.fotoUrl)}
                      alt={`Foto ${matched.namaAset}`}
                      className="object-contain w-full"
                      style={{maxHeight:"220px"}}
                      onError={(e) => { e.target.parentNode.style.display='none'; }}
                    />
                  </div>
                )}
                <div className="grid grid-cols-2 gap-4 text-xs">
                  <div className="space-y-1 bg-slate-950/40 p-3 rounded-xl border border-[#1e5574]/20">
                    <span className="text-[9px] text-slate-500 font-bold uppercase block">Lokasi</span>
                    <p className="font-bold text-slate-200">{matched.lokasi || "-"}</p>
                  </div>
                  <div className="space-y-1 bg-slate-950/40 p-3 rounded-xl border border-[#1e5574]/20">
                    <span className="text-[9px] text-slate-500 font-bold uppercase block">Tanggal Pembelian</span>
                    <p className="font-bold text-slate-200 font-mono">
                      {(() => {
                        if (!matched.tanggalBeli) return "-";
                        const d = new Date(matched.tanggalBeli);
                        if (isNaN(d.getTime())) return String(matched.tanggalBeli);
                        const y = d.getFullYear();
                        const m = String(d.getMonth() + 1).padStart(2, "0");
                        const datePart = String(d.getDate()).padStart(2, "0");
                        return `${datePart}/${m}/${y}`;
                      })()}
                    </p>
                  </div>
                  <div className="space-y-1 bg-slate-950/40 p-3 rounded-xl border border-[#1e5574]/20">
                    <span className="text-[9px] text-slate-500 font-bold uppercase block">Masa Pakai</span>
                    <p className="font-bold text-slate-200">{matched.masaManfaat || "-"}</p>
                  </div>
                  <div className="space-y-1 bg-slate-950/40 p-3 rounded-xl border border-[#1e5574]/20">
                    <span className="text-[9px] text-slate-500 font-bold uppercase block">Keterangan</span>
                    <p className="font-bold text-slate-200 leading-tight">{matched.keterangan || "Tidak ada catatan."}</p>
                  </div>
                </div>
                <div className="p-3 bg-emerald-500/5 rounded-xl border border-emerald-500/10 flex items-center gap-2 text-[10px] text-emerald-400">
                  <Icon name="shield-check" className="h-4.5 w-4.5 text-emerald-400 shrink-0" />
                  <span>Aset ini dinyatakan valid terdaftar di database perusahaan.</span>
                </div>
              </div>
            ) : (
              <div className="p-6 bg-red-500/10 border border-red-500/20 text-red-400 rounded-2xl text-center text-xs space-y-1">
                <Icon name="alert-circle" className="h-6 w-6 mx-auto text-red-400 mb-1" />
                <p className="font-bold">Aset Tidak Terdaftar</p>
                <p className="text-[10px] text-slate-500">Pastikan kode aset atau nomor barcode benar.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── PergerakanSOView ───────────────────────────────────────────────────────
    // Qty Draft Sistem  = SUM of qty per kodeBarang from activeSO (grouped)
    // Qty Fisik Import  = qtyFisik from imported Excel file (via SheetJS)
    function PergerakanSOView({ activeSO, importedItems, importedFileName, setImportedItems, setImportedFileName, triggerToast, finalSORecords, setFinalSORecords }) {
      const [search, setSearch] = useState("");
      const [statusFilter, setStatusFilter] = useState("Semua Status");
      const [currentPage, setCurrentPage] = useState(1);
      const [isLoading, setIsLoading] = useState(false);
      const [periode, setPeriode] = useState(() => {
        const now = new Date();
        const months = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
        return `${months[now.getMonth()]} ${now.getFullYear()}`;
      });
      const [lokasi, setLokasi] = useState("Gudang Utama");
      const [confirmFinal, setConfirmFinal] = useState(false);
      const ITEMS_PER_PAGE = 10;

      // Qty Draft Sistem: aggregate all activeSO rows by kodeBarang
      const draftMap = useMemo(() => {
        const map = new Map();
        activeSO.forEach(item => {
          const ex = map.get(item.kodeBarang);
          map.set(item.kodeBarang, { nama: item.namaBarang, qty: (ex ? ex.qty : 0) + item.qty });
        });
        return map;
      }, [activeSO]);

      // Qty Fisik Import: keyed by kodeBarang from imported Excel
      const fisikMap = useMemo(() => {
        const map = new Map();
        importedItems.forEach(i => map.set(i.kodeBarang, i));
        return map;
      }, [importedItems]);

      // Union all keys from both sources
      const rows = useMemo(() => {
        const keys = new Set([...draftMap.keys(), ...fisikMap.keys()]);
        let no = 0;
        return Array.from(keys).map(key => {
          no++;
          const draft = draftMap.get(key);
          const imp   = fisikMap.get(key);
          const qtyDraft = draft ? draft.qty : null;
          const qtyFisik = imp   ? imp.qtyFisik : null;
          const selisih  = (qtyFisik ?? 0) - (qtyDraft ?? 0);
          let status = "Belum Terhitung";
          if (qtyDraft !== null && qtyFisik !== null) {
            status = selisih > 0 ? "Selisih Lebih" : selisih < 0 ? "Selisih Kurang" : "Sesuai";
          }
          return { no, kodeBarang: key, namaBarang: draft?.nama ?? imp?.namaBarang ?? "-", satuan: imp?.satuan ?? "Pcs", qtyDraft, qtyFisik, selisih, status };
        });
      }, [draftMap, fisikMap]);

      const filtered = useMemo(() => rows.filter(r => {
        const s = search.toLowerCase();
        return (r.namaBarang.toLowerCase().includes(s) || r.kodeBarang.toLowerCase().includes(s))
          && (statusFilter === "Semua Status" || r.status === statusFilter);
      }), [rows, search, statusFilter]);

      const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
      const paged = filtered.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

      const summary = useMemo(() => ({
        total: rows.length,
        sesuai: rows.filter(r => r.status === "Sesuai").length,
        lebih:  rows.filter(r => r.status === "Selisih Lebih").length,
        kurang: rows.filter(r => r.status === "Selisih Kurang").length,
        belum:  rows.filter(r => r.status === "Belum Terhitung").length,
      }), [rows]);

      // ── SheetJS import ────────────────────────────────────────────────────────
      // Supports .xlsx / .xls / .csv
      // Expected header (case-insensitive): KodeBarang | NamaBarang | Satuan | QtyFisik | Lokasi
      // Falls back to column position: col0=kode, col1=nama, col2=satuan, col3=qty, col4=lokasi
      const handleFileImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setIsLoading(true);
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = new Uint8Array(ev.target.result);
            const wb   = XLSX.read(data, { type: "array" });
            const ws   = wb.Sheets[wb.SheetNames[0]];
            const raw  = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
            if (raw.length < 2) throw new Error("File kosong atau hanya header.");

            const header = raw[0].map(h => String(h ?? "").toLowerCase().trim());
            const idx = {
              kode:   header.findIndex(h => h.includes("kode") || h === "barcode"),
              nama:   header.findIndex(h => h.includes("nama")),
              satuan: header.findIndex(h => h.includes("satuan") || h.includes("unit") || h.includes("uom")),
              qty:    header.findIndex(h => h.includes("qty") || h.includes("jumlah") || h.includes("fisik") || h.includes("kuantitas")),
              lokasi: header.findIndex(h => h.includes("lokasi") || h.includes("location") || h.includes("gudang")),
            };
            if (idx.kode   < 0) idx.kode   = 0;
            if (idx.nama   < 0) idx.nama   = 1;
            if (idx.satuan < 0) idx.satuan  = 2;
            if (idx.qty    < 0) idx.qty    = 3;
            if (idx.lokasi < 0) idx.lokasi  = 4;

            const parsed = raw.slice(1)
              .map(r => {
                const kode = String(r[idx.kode]  ?? "").trim().replace(/\.0+$/, "");
                const nama = String(r[idx.nama]  ?? "").trim();
                const sat  = String(r[idx.satuan] ?? "Pcs").trim() || "Pcs";
                const qRaw = r[idx.qty];
                const qty  = typeof qRaw === "number" ? qRaw : parseFloat(String(qRaw ?? "0").replace(",", ".")) || 0;
                const lok  = String(r[idx.lokasi] ?? "").trim() || "Gudang";
                return { kodeBarang: kode, namaBarang: nama, satuan: sat, qtyFisik: qty, lokasi: lok };
              })
              .filter(i => i.kodeBarang !== "");

            if (parsed.length === 0) throw new Error("Tidak ada baris valid. Periksa format kolom.");
            setImportedItems(parsed);
            setImportedFileName(file.name);
            setCurrentPage(1);
            triggerToast(`✓ ${parsed.length} baris diimport dari "${file.name}". Tabel perbandingan diperbarui.`);
          } catch (err) {
            triggerToast(`Gagal membaca file: ${err.message}`);
          } finally {
            setIsLoading(false);
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = "";
      };

      // ── Export comparison to real .xlsx ───────────────────────────────────────
      const handleExport = () => {
        const wsData = [
          ["No","Kode Barang","Nama Barang","Satuan","Qty Draft Sistem","Qty Fisik Import","Selisih","Status"],
          ...rows.map(r => [r.no, r.kodeBarang, r.namaBarang, r.satuan,
            r.qtyDraft ?? "-", r.qtyFisik ?? "-", r.selisih, r.status]),
        ];
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws["!cols"] = [4,18,30,8,14,14,10,18].map(w => ({ wch: w }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Pergerakan SO");
        XLSX.writeFile(wb, `Pergerakan_SO_${periode.replace(/ /g,"_")}_${Date.now()}.xlsx`);
        triggerToast("File Excel berhasil diunduh.");
      };

      // ── Finalize ─────────────────────────────────────────────────────────────
      const handleFinalize = () => {
        const record = {
          id: `final-${Date.now()}`,
          periode,
          tanggalFinalisasi: new Date().toLocaleString("id-ID"),
          lokasi,
          namaFileDraft: `Draft_SO_${Date.now()}.xlsx`,
          namaFileImport: importedFileName || `Import_${Date.now()}.xlsx`,
          jumlahSKU: rows.length,
          totalSelisih: rows.reduce((s, r) => s + Math.abs(r.selisih), 0),
          rows: [...rows],
        };
        setFinalSORecords([record, ...(finalSORecords || [])]);
        setConfirmFinal(false);
        triggerToast("Laporan pergerakan berhasil difinalisasi → Hasil SO Final!");
      };

      const inp = "bg-slate-900 border border-[#1e5574]/60 text-slate-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500/50";
      const badgeCls = (s) => s === "Selisih Lebih" ? "bg-emerald-500/10 border border-emerald-500/20 text-emerald-400"
        : s === "Selisih Kurang" ? "bg-red-500/10 border border-red-500/20 text-red-400"
        : s === "Sesuai" ? "bg-yellow-500/10 border border-yellow-500/20 text-yellow-400"
        : "bg-blue-500/10 border border-blue-500/20 text-blue-400";

      return (
        <div className="space-y-6">
          {/* Legend + import card */}
          <div className="rounded-2xl border border-[#1e5574] bg-[#12324b]/40 p-5 space-y-4">
            <h3 className="text-xs font-extrabold uppercase text-white flex items-center gap-2">
              <Icon name="upload" className="h-4 w-4 text-blue-400" /> Import Data Fisik (Excel / CSV)
            </h3>
            {/* Two-column legend */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-[10px]">
              <div className="bg-blue-500/5 border border-blue-500/15 rounded-xl p-3 space-y-1">
                <p className="font-extrabold text-blue-400 uppercase tracking-wide">Qty Draft Sistem</p>
                <p className="text-slate-400 leading-relaxed">
                  Dihitung otomatis dari <span className="text-slate-200 font-semibold">total qty semua baris</span> di Daftar Hasil SO (Draft), dikelompokkan per kode barang.
                </p>
              </div>
              <div className="bg-emerald-500/5 border border-emerald-500/15 rounded-xl p-3 space-y-1">
                <p className="font-extrabold text-emerald-400 uppercase tracking-wide">Qty Fisik Import</p>
                <p className="text-slate-400 leading-relaxed">
                  Dari file Excel yang diimport. Kolom: <span className="font-mono text-slate-200">KodeBarang | NamaBarang | Satuan | QtyFisik | Lokasi</span>
                </p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
              {/* File picker */}
              <div className="space-y-2">
                <label className="block cursor-pointer">
                  <div className={`flex items-center gap-3 border-2 border-dashed rounded-xl px-4 py-4 transition-colors ${isLoading ? "border-blue-500/40 bg-blue-500/5" : "border-[#1e5574] hover:border-blue-500/40"}`}>
                    {isLoading
                      ? <div className="h-5 w-5 border-2 border-blue-400 border-t-transparent rounded-full animate-spin shrink-0" />
                      : <Icon name="upload" className="h-5 w-5 text-slate-400 shrink-0" />}
                    <div className="min-w-0">
                      <p className="text-xs font-bold text-slate-200">{isLoading ? "Memproses file..." : "Pilih File Excel (.xlsx / .xls / .csv)"}</p>
                      {importedFileName
                        ? <p className="text-[10px] text-emerald-400 mt-0.5 truncate">✓ {importedFileName} ({importedItems.length} baris)</p>
                        : <p className="text-[10px] text-slate-500 mt-0.5">Belum ada file diimport</p>}
                    </div>
                  </div>
                  <input type="file" accept=".xls,.xlsx,.csv,.txt,.tsv" onChange={handleFileImport} disabled={isLoading} className="sr-only" />
                </label>
                {importedItems.length > 0 && (
                  <button onClick={() => { setImportedItems([]); setImportedFileName(""); setCurrentPage(1); triggerToast("Data import dibersihkan."); }}
                    className="text-[10px] text-red-400 hover:underline flex items-center gap-1">
                    <Icon name="trash-2" className="h-3 w-3" /> Hapus data import
                  </button>
                )}
              </div>

              {/* Periode, lokasi, actions */}
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-2">
                  <div className="space-y-1">
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Periode</label>
                    <input value={periode} onChange={e => setPeriode(e.target.value)} className={`w-full ${inp}`} />
                  </div>
                  <div className="space-y-1">
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Lokasi</label>
                    <select value={lokasi} onChange={e => setLokasi(e.target.value)} className={`w-full ${inp}`}>
                      {LOCATIONS.map(l => <option key={l}>{l}</option>)}
                    </select>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={handleExport} disabled={rows.length === 0}
                    className="flex-1 py-2 bg-[#1e5574]/40 hover:bg-[#1e5574]/60 border border-[#1e5574] text-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 disabled:opacity-40">
                    <Icon name="file-down" className="h-4 w-4" /> Unduh Excel
                  </button>
                  <button onClick={() => setConfirmFinal(true)} disabled={rows.length === 0}
                    className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 disabled:opacity-40">
                    <Icon name="check" className="h-4 w-4" /> Finalisasi
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Summary cards */}
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            {[
              { label: "Total SKU",       val: summary.total,  cls: "text-slate-100" },
              { label: "Sesuai",          val: summary.sesuai, cls: "text-yellow-400" },
              { label: "Selisih Lebih",   val: summary.lebih,  cls: "text-emerald-400" },
              { label: "Selisih Kurang",  val: summary.kurang, cls: "text-red-400" },
              { label: "Belum Terhitung", val: summary.belum,  cls: "text-blue-400" },
            ].map(c => (
              <div key={c.label} className="rounded-xl border border-[#1e5574]/30 bg-[#12324b]/40 p-3.5 text-center">
                <p className={`text-2xl font-black ${c.cls}`}>{c.val}</p>
                <p className="text-[9px] text-slate-500 uppercase font-semibold mt-0.5">{c.label}</p>
              </div>
            ))}
          </div>

          {/* Filters */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-[#12324b]/10 border border-[#1e5574]/30 rounded-2xl p-4">
            <div className="relative md:col-span-2">
              <input value={search} onChange={e => { setSearch(e.target.value); setCurrentPage(1); }}
                placeholder="Cari kode atau nama barang..."

                </div>
                <p className="text-sm font-bold text-slate-300">Belum Ada Data Perbandingan</p>
                <p className="text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">

                      <tr className="border-b border-[#1e5574] text-slate-400 font-semibold uppercase bg-slate-900/40 text-[10px] tracking-wider">
                        <th className="py-3 px-3 text-center w-10">No</th>
                        <th className="py-3 px-3 whitespace-nowrap">Kode Barang</th>
                        <th className="py-3 px-3 whitespace-nowrap">Nama Barang</th>
                        <th className="py-3 px-3 whitespace-nowrap">Satuan</th>
                        <th className="py-3 px-3 text-center whitespace-nowrap">
                          <span className="text-blue-400">Qty Draft Sistem</span>

                        <th className="py-3 px-3 text-center whitespace-nowrap">
                          <span className="text-emerald-400">Qty Fisik Import</span>
                        </th>

                        <th className="py-3 px-3 whitespace-nowrap">Status</th>

                    <tbody className="divide-y divide-[#1e5574]/30 text-slate-300">
                      {paged.map(row => (
                        <tr key={row.kodeBarang} className="hover:bg-slate-900/10 transition-colors text-[11px]">
                          <td className="py-2.5 px-3 text-center text-slate-500">{row.no}</td>
                          <td className="py-2.5 px-3 font-mono text-slate-400 whitespace-nowrap">{row.kodeBarang}</td>
                          <td className="py-2.5 px-3 font-semibold text-slate-200 whitespace-nowrap">{row.namaBarang}</td>
                          <td className="py-2.5 px-3 text-slate-400">{row.satuan}</td>
                          <td className="py-2.5 px-3 text-center">
                            {row.qtyDraft === null
                              ? <span className="text-slate-600">—</span>
                              : <span className="font-black text-blue-300">{row.qtyDraft}</span>}
                          </td>
                          <td className="py-2.5 px-3 text-center">
                            {row.qtyFisik === null
                              ? <span className="text-slate-500 text-[10px]">Belum diimport</span>
                              : <span className="font-black text-emerald-400">{row.qtyFisik}</span>}
                          </td>
                          <td className="py-2.5 px-3 text-center">
                            {row.qtyDraft !== null && row.qtyFisik !== null
                              ? <span className={`font-black text-base ${row.selisih > 0 ? "text-emerald-400" : row.selisih < 0 ? "text-red-400" : "text-slate-500"}`}>
                                  {row.selisih > 0 ? `+${row.selisih}` : row.selisih}
                                </span>
                              : <span className="text-slate-600">—</span>}
                          </td>
                          <td className="py-2.5 px-3">
                            <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded text-[9px] font-bold ${badgeCls(row.status)}`}>
                              {row.status === "Belum Terhitung" && <Icon name="alert-triangle" className="h-2.5 w-2.5" />}
                              {row.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="px-4 py-3 border-t border-[#1e5574]/30 flex items-center justify-between text-[11px] text-slate-500 bg-slate-950/10">
                  <p>Menampilkan {paged.length} dari {filtered.length} baris</p>
                  <div className="flex items-center gap-1">
                    <button disabled={currentPage === 1} onClick={() => setCurrentPage(p => p - 1)}
                      className="p-1.5 border border-slate-800 rounded-lg disabled:opacity-40 text-slate-400">
                      <Icon name="chevron-left" className="h-3.5 w-3.5" />
                    </button>
                    <span className="px-3 font-bold text-slate-300 font-mono">Hal {currentPage} / {totalPages}</span>
                    <button disabled={currentPage >= totalPages} onClick={() => setCurrentPage(p => p + 1)}
                      className="p-1.5 border border-slate-800 rounded-lg disabled:opacity-40 text-slate-400">
                      <Icon name="chevron-right" className="h-3.5 w-3.5" />
                    </button>
                  </div>
                </div>
              </>
            )}
          </div>

          {/* Confirm finalize */}
          {confirmFinal && (
            <ConfirmDialog
              isOpen={confirmFinal}
              title="Finalisasi Laporan Pergerakan?"
              message={`Simpan ${rows.length} baris data untuk periode "${periode}" di ${lokasi} ke laporan final? Data akan diarsipkan.`}
              onConfirm={handleFinalize}
              onCancel={() => setConfirmFinal(false)}
            />
          )}
        </div>
      );
    }

    // ─── AdminDataView ──────────────────────────────────────────────────────────
    function AdminDataView({ 
      assets, onAddAsset, onUpdateAsset, onConfirmDeleteAsset, 
      activeSO, onOpenConfirmCompleteSO, onUpdateSOItem, onDeleteSOItem, 
      completedSO, onUpdateCompletedSO, onDeleteCompletedSO, 
      adminSubTab, setAdminSubTab, sheetUrl, triggerToast, onSaveSODraft,
      importedItems, setImportedItems, importedFileName, setImportedFileName,
      finalSORecords, setFinalSORecords,
    }) {
      const [assetSearch, setAssetSearch] = useState("");
      const [filterCategory, setFilterCategory] = useState("Semua Kategori");
      const [filterLocation, setFilterLocation] = useState("Semua Lokasi");
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 7;

      const [editingSOId, setEditingSOId] = useState(null);
      const [editingQty, setEditingQty] = useState(1);
      const [editingLokasi, setEditingLokasi] = useState("");

      const [editingCompletedId, setEditingCompletedId] = useState(null);
      const [editingCompletedPeriode, setEditingCompletedPeriode] = useState("");
      const [editingCompletedLokasi, setEditingCompletedLokasi] = useState("");

      const [completionPeriode, setCompletionPeriode] = useState(() => {
        const now = new Date();
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        return `${months[now.getMonth()]} ${now.getFullYear()}`;
      });
      const [completionLokasi, setCompletionLokasi] = useState("Gudang Utama");

      const [completedYearFilter, setCompletedYearFilter] = useState("2026");
      const [completedLocationFilter, setCompletedLocationFilter] = useState("Semua Lokasi");
      const [completedSearch, setCompletedSearch] = useState("");
      const [completedCurrentPage, setCompletedCurrentPage] = useState(1);

      const [activeSOCurrentPage, setActiveSOCurrentPage] = useState(1);
      const [soSearch, setSoSearch] = useState("");
      const [soDateFilter, setSoDateFilter] = useState("");

      const [formMode, setFormMode] = useState("add");
      const [editingId, setEditingId] = useState(null);
      const [formKodeAset, setFormKodeAset] = useState("");
      const [formBarcode, setFormBarcode] = useState("");
      const [formNamaAset, setFormNamaAset] = useState("");
      const [formKategori, setFormKategori] = useState(CATEGORIES[0]);
      const [formLokasi, setFormLokasi] = useState(LOCATIONS[0]);
      const [formTanggalBeli, setFormTanggalBeli] = useState("");
      const [formMasaManfaat, setFormMasaManfaat] = useState("4 Tahun");
      const [formStatus, setFormStatus] = useState("Aktif");
      const [formKeterangan, setFormKeterangan] = useState("");
      const [formFotoUrl, setFormFotoUrl] = useState("");

      // Convert any Google Drive share URL to a thumbnail embeddable image URL
      const fotoPreviewUrl = convertDriveUrl(formFotoUrl);

      // Auto-generate Kode Aset & Barcode otomatis hanya saat mode 'add' diaktifkan
      useEffect(() => {
        if (formMode === "add") {
          // 1. Cari nomor terbesar dari kode aset yang sudah ada (misal: AST0010 -> 10)
          let maxNum = 0;
          if (Array.isArray(assets) && assets.length > 0) {
            assets.forEach(a => {
              if (a.kodeAset) {
                const num = parseInt(a.kodeAset.replace(/[^0-9]/g, ""), 10);
                if (!isNaN(num) && num > maxNum) maxNum = num;
              }
            });
          }

          // 2. Format kode aset baru (contoh: AST0011)
          const nextKode = `AST${(maxNum + 1).toString().padStart(4, "0")}`;
          setFormKodeAset(nextKode);

          // 3. Generate barcode EAN-13 acak jika form barcode masih kosong
          if (!formBarcode) {
            const randomDigits = Math.floor(1000000 + Math.random() * 9000000).toString();
            setFormBarcode(`880609${randomDigits}`);
          }
        }
      }, [formMode]); // Hanya terpicu saat formMode berubah ke "add"
      const handleResetForm = () => {
        setFormMode("add"); setEditingId(null); setFormNamaAset("");
        setFormKategori(CATEGORIES[0]); setFormLokasi(LOCATIONS[0]);
        setFormTanggalBeli(""); setFormMasaManfaat("4 Tahun"); setFormStatus("Aktif"); setFormKeterangan(""); setFormFotoUrl("");
      };

      const handleEditClick = (asset) => {
        setFormMode("edit"); setEditingId(asset.id); setFormKodeAset(asset.kodeAset);
        setFormBarcode(asset.barcode); setFormNamaAset(asset.namaAset); setFormKategori(asset.kategori);
        setFormLokasi(asset.lokasi); setFormTanggalBeli(asset.tanggalBeli); setFormMasaManfaat(asset.masaManfaat);
        setFormStatus(asset.status); setFormKeterangan(asset.keterangan || ""); setFormFotoUrl(asset.fotoUrl || "");
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formNamaAset.trim() || !formBarcode.trim() || !formTanggalBeli.trim()) {
          triggerToast("Isi seluruh field bertanda (*)");
          return;
        }
        const payload = {
          id: formMode === "add" ? `gas-${Date.now()}` : editingId,
          kodeAset: formKodeAset, barcode: formBarcode, namaAset: formNamaAset.trim(),
          kategori: formKategori, lokasi: formLokasi, tanggalBeli: formTanggalBeli,
          masaManfaat: formMasaManfaat, status: formStatus, keterangan: formKeterangan.trim(),
          fotoUrl: formFotoUrl.trim()
        };
        if (formMode === "add") onAddAsset(payload); else onUpdateAsset(payload);
        handleResetForm();
      };

      const downloadAsExcel = (fileName, title, items) => {
        const rows = (items || []).map((item, index) => `
          <tr>
            <td>${index + 1}</td>
            <td style="mso-number-format:'\\@'; font-family:Consolas, monospace;">${item.kodeBarang}</td>
            <td>${item.namaBarang}</td>
            <td>${item.lokasi}</td>
            <td style="font-weight:bold; color:#1e40af;">${item.qty}</td>
            <td style="font-family:Consolas, monospace;">${item.waktuInput}</td>
          </tr>
        `).join('');

        const html = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
          <head><meta charset="utf-8" />
          <style>
            table { border-collapse: collapse; width: 100%; }
            td, th { border: 1px solid #dddddd; padding: 8px; font-family: 'Segoe UI', sans-serif; text-align: left; }
            th { background-color: #1e5574; color: #ffffff; font-weight: bold; }
            tr:nth-child(even) { background-color: #f8fafc; }
            h2 { font-family: 'Segoe UI', sans-serif; color: #2563eb; }
            p { font-family: 'Segoe UI', sans-serif; font-size: 12px; color: #475569; }
          </style>
          </head>
          <body>
            <h2>${title}</h2>
            <p>Tanggal Cetak: ${new Date().toLocaleString("id-ID")}</p>
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>Kode / Barcode</th>
                  <th>Nama Barang</th>
                  <th>Lokasi Audit</th>
                  <th>Qty Fisik</th>
                  <th>Waktu Input</th>
                </tr>
              </thead>
              <tbody>
                ${rows || '<tr><td colspan="6" style="text-align:center; color:#94a3b8; font-style:italic;">Tidak ada data item.</td></tr>'}
              </tbody>
            </table>
          </body>
          </html>
        `;
        const blob = new Blob([html], { type: "application/vnd.ms-excel" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      };

      const filteredAssets = useMemo(() => {
        return assets.filter(a => {
          const s = assetSearch.toLowerCase();
          return (a.namaAset.toLowerCase().includes(s) || a.kodeAset.toLowerCase().includes(s) || a.barcode.toLowerCase().includes(s)) &&
                 (filterCategory === "Semua Kategori" || a.kategori === filterCategory) &&
                 (filterLocation === "Semua Lokasi" || a.lokasi === filterLocation);
        });
      }, [assets, assetSearch, filterCategory, filterLocation]);

      const filteredActiveSO = useMemo(() => {
        return activeSO.filter(item => {
          const s = soSearch.toLowerCase();
          return (item.namaBarang.toLowerCase().includes(s) || item.kodeBarang.toLowerCase().includes(s)) &&
                 (!soDateFilter || (item.waktuInput && item.waktuInput.includes(soDateFilter)));
        });
      }, [activeSO, soSearch, soDateFilter]);

      const filteredCompletedSO = useMemo(() => {
        return completedSO.filter(so => {
          const s = completedSearch.toLowerCase();
          return (completedYearFilter === "Semua Tahun" || (so.tanggalSelesai && so.tanggalSelesai.includes(completedYearFilter))) &&
                 (completedLocationFilter === "Semua Lokasi" || so.lokasi === completedLocationFilter) &&
                 (!completedSearch || (so.periode && so.periode.toLowerCase().includes(s)) || (so.namaFileExcel && so.namaFileExcel.toLowerCase().includes(s)));
        });
      }, [completedSO, completedYearFilter, completedLocationFilter, completedSearch]);

      const ADMIN_SUBTABS = [
        { id: "daftar-aset", label: "Daftar Aset Tetap", icon: "database" },
        { id: "hasil-so", label: "Daftar Hasil SO (Draf)", icon: "layers" },
        { id: "pergerakan-so", label: "Pergerakan SO", icon: "git-compare-arrows" },
        { id: "daftar-hasil-so", label: "Daftar Hasil SO (Selesai)", icon: "folder-check" }
      ];

      return (
        <div className="p-4 sm:p-6 md:p-8 space-y-6 max-w-7xl mx-auto">
          <div className="flex border-b border-[#1e5574]/60 text-xs font-bold leading-none select-none overflow-x-auto no-scrollbar scroll-smooth whitespace-nowrap">
            {ADMIN_SUBTABS.map(sub => (
              <button
                key={sub.id}
                onClick={() => setAdminSubTab(sub.id)}
                className={`px-5 py-4.5 border-b-2 -mb-[2px] transition-all flex items-center gap-2 ${adminSubTab === sub.id ? "border-blue-500 text-blue-400 bg-blue-500/5" : "border-transparent text-slate-400 hover:text-slate-200"}`}
              >
                <Icon name={sub.icon} className="h-4 w-4" />
                {sub.label}
              </button>
            ))}
          </div>

          <div className={adminSubTab === "daftar-aset" ? "" : "hidden"}>
            <div className="grid grid-cols-1 xl:grid-cols-12 gap-8 items-start">
              <div className="xl:col-span-4 rounded-2xl border border-[#1e5574] bg-[#12324b]/40 p-6 space-y-6">
                <div className="flex items-center justify-between">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-white flex items-center gap-2">
                    <Icon name={formMode === "add" ? "plus-circle" : "edit"} className={formMode === "add" ? "text-blue-400" : "text-amber-400"} />
                    {formMode === "add" ? "Registrasi Aset Baru" : "Edit Informasi Aset"}
                  </h3>
                  {formMode === "edit" && <button type="button" onClick={handleResetForm} className="text-[10px] text-slate-500 hover:text-slate-300 font-bold transition-all">Batal Edit</button>}
                </div>
                <form onSubmit={handleSave} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1.5">
                      <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">ID Kode Aset</label>
                      <input type="text" disabled value={formKodeAset} className="w-full bg-slate-950/60 border border-[#1e5574] text-slate-400 rounded-xl px-3 py-2 font-mono font-bold cursor-not-allowed" />
                    </div>
                    <div className="space-y-1.5">
                      <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Barcode *</label>
                      <input type="text" required value={formBarcode} onChange={(e) => setFormBarcode(e.target.value)} className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3 py-2 font-mono font-bold" />
                    </div>
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Nama Barang Aset *</label>
                    <input type="text" required value={formNamaAset} onChange={(e) => setFormNamaAset(e.target.value)} placeholder="Contoh: AC LG 1.5 PK" className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3.5 py-2.5" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1.5">
                      <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Kategori</label>
                      <select value={formKategori} onChange={(e) => setFormKategori(e.target.value)} className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3 py-2">{CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}</select>
                    </div>
                    <div className="space-y-1.5">
                      <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Lokasi Utama</label>
                      <select value={formLokasi} onChange={(e) => setFormLokasi(e.target.value)} className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3 py-2">{LOCATIONS.map(loc => <option key={loc} value={loc}>{loc}</option>)}</select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1.5">
                      <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Tanggal Beli *</label>
                      <input type="date" required value={formTanggalBeli} onChange={(e) => setFormTanggalBeli(e.target.value)} className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3 py-2 font-mono" />
                    </div>
                    <div className="space-y-1.5">
                      <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Masa Manfaat</label>
                      <select value={formMasaManfaat} onChange={(e) => setFormMasaManfaat(e.target.value)} className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3 py-2">
                        {["4 Tahun", "5 Tahun", "6 Tahun", "8 Tahun", "10 Tahun"].map(th => <option key={th} value={th}>{th}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide block">Status Operasional</label>
                    <div className="flex gap-4">
                      {["Aktif", "Rusak"].map(st => (
                        <label key={st} className="flex items-center gap-2 cursor-pointer text-slate-300">
                          <input type="radio" name="formStatus" value={st} checked={formStatus === st} onChange={(e) => setFormStatus(e.target.value)} className="text-blue-600 focus:ring-0 bg-slate-900 border-[#1e5574]" />
                          <span>{st}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Keterangan</label>
                    <textarea rows="2" value={formKeterangan} onChange={(e) => setFormKeterangan(e.target.value)} placeholder="Catatan tambahan..." className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3.5 py-2" />
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Foto Aset (URL / Link Google Drive)</label>
                    <input
                      type="text"
                      value={formFotoUrl}
                      onChange={(e) => setFormFotoUrl(e.target.value)}
                      placeholder="https://drive.google.com/file/d/... atau URL foto langsung"
                      className="w-full bg-slate-900 border border-[#1e5574] text-slate-200 rounded-xl px-3.5 py-2 text-[11px]"
                    />
                    {fotoPreviewUrl && (
                      <div className="mt-2 rounded-xl overflow-hidden border border-[#1e5574]/60 bg-slate-950/50 flex items-center justify-center" style={{maxHeight:"160px"}}>
                        <img
                          src={fotoPreviewUrl}
                          alt="Preview foto aset"
                          className="object-contain w-full"
                          style={{maxHeight:"160px"}}
                          onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }}
                        />
                        <div className="hidden items-center justify-center p-4 text-slate-500 text-[10px] flex-col gap-1" style={{minHeight:"80px"}}>
                          <Icon name="image-off" className="h-6 w-6 text-slate-600" />
                          <span>Gagal memuat gambar. Periksa URL / izin Google Drive.</span>
                        </div>
                      </div>
                    )}
                    <p className="text-[9px] text-slate-500 leading-relaxed">Tempel link Google Drive (bagikan dulu sebagai "Anyone with the link") atau URL gambar langsung.</p>
                  </div>
                  <button type="submit" className={`w-full py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 ${formMode === "add" ? "bg-blue-600 text-white" : "bg-amber-500 text-slate-950 font-black"}`}>
                    <Icon name={formMode === "add" ? "save" : "check-square"} className="h-4 w-4" />
                    <span>{formMode === "add" ? "Simpan Aset Baru" : "Terapkan Perubahan"}</span>
                  </button>
                </form>
