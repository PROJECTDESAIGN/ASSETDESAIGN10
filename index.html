      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
          <div className="bg-[#12324b] border border-[#1e5574] w-full max-w-sm rounded-2xl p-6 space-y-6">
            <div className="text-center space-y-2">
              <div className="h-12 w-12 bg-blue-500/10 text-blue-500 rounded-2xl flex items-center justify-center mx-auto"><Icon name="shield-check" className="h-6 w-6" /></div>
              <h4 className="font-extrabold text-sm text-white">Otorisasi Sesi Administrator</h4>
              <p className="text-[11px] text-slate-400">Masukkan username dan password Anda untuk mengelola Data Master.</p>
            </div>
            {error && <div className="p-3 bg-red-500/10 border border-red-500/15 text-red-400 rounded-xl text-[10px] text-center font-bold font-mono">{error}</div>}
            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="space-y-1.5">
                <label className="text-[10px] font-bold text-slate-400 uppercase">Username</label>
                <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Masukkan username" className="w-full bg-slate-900 border border-[#1e5574] rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none" />
              </div>
              <div className="space-y-1.5">
                <label className="text-[10px] font-bold text-slate-400 uppercase">Password</label>
                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" className="w-full bg-slate-900 border border-[#1e5574] rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none" />
              </div>
              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 py-2.5 border border-slate-700 text-slate-300 rounded-xl font-bold">Batal</button>
                <button type="submit" className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold">Masuk Admin</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [adminSubTab, setAdminSubTab] = useState("daftar-aset");
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [isAdminMenuExpanded, setIsAdminMenuExpanded] = useState(true);
      const [isMobileOpen, setIsMobileOpen] = useState(false);

      const [assets, setAssets] = useState(INITIAL_ASSETS);
      const [activeSO, setActiveSO] = useState(INITIAL_ACTIVE_SO);
      const [completedSO, setCompletedSO] = useState(INITIAL_COMPLETED_SO);
      const [importedItems, setImportedItems] = useState([]);
      const [importedFileName, setImportedFileName] = useState("");
      const [finalSORecords, setFinalSORecords] = useState([]);
      const [sheetUrl, setSheetUrl] = useState("");
      const [isGasActive, setIsGasActive] = useState(
        () => typeof GAS_URL !== "undefined" && GAS_URL.startsWith("https://script.google.com/")
      );

      const [toast, setToast] = useState(null);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: "", message: "", onConfirm: () => {} });

      const triggerToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      // Memuat data dari Google Sheets saat aplikasi pertama kali dibuka
      useEffect(() => {
        const loadInitialData = async () => {
          // Pastikan GAS_URL sudah diisi dan bukan URL dummy/default
          if (typeof GAS_URL !== "undefined" && GAS_URL && !GAS_URL.includes("AKfycbx...")) {
            try {
              setIsGasActive(true);
              triggerToast("Menghubungkan ke Google Sheets...");
              
              // Panggil fungsi mengambil data aset dari GAS
              const res = await sendToGAS("getAssets");
              
              if (res && (res.status === "success" || res.success) && !res.error) {
                const snapshot = res.data || res;
                setAssets(Array.isArray(snapshot.assets) ? snapshot.assets : []);
                setActiveSO(Array.isArray(snapshot.activeSO) ? snapshot.activeSO : []);
                setCompletedSO(Array.isArray(snapshot.completedSO) ? snapshot.completedSO : []);
                setSheetUrl(snapshot.sheetUrl || "");
                triggerToast("✓ Data aset berhasil dimuat dari Spreadsheet!");
              } else {
                setIsGasActive(false);
                triggerToast(`⚠️ ${res?.error || "Format data dari Spreadsheet tidak sesuai."}`);
              }
            } catch (error) {
              console.error("Gagal memuat data dari GAS:", error);
              setIsGasActive(false);
              triggerToast("⚠️ Koneksi GAS gagal. Berjalan dalam Mode Offline.");
            }
          } else {
            setIsGasActive(false);
            triggerToast("Mode Offline (URL GAS belum dikonfigurasi).");
          }
        };

        loadInitialData();
      }, []); // Berjalan sekali saat pertama kali aplikasi dibuka
     const fetchSpreadsheetData = async () => {
        if (!isGasActive) return;

        try {
          // Panggil fungsi sendToGAS untuk mengambil seluruh data
          const res = await sendToGAS("getAssets");

          if (res && (res.status === "success" || res.success || !res.error)) {
            // Ambil data dari respon
            const data = res.data || res;
            
            setAssets(data.assets || data.data || []);
            setActiveSO(data.activeSO || []);
            setCompletedSO(data.completedSO || []);
            setSheetUrl(data.sheetUrl || "");
          } else {
            triggerToast(`Gagal memuat spreadsheet: ${res.error || 'Respon tidak valid'}`);
          }
        } catch (err) {
          const message = err && err.message ? err.message : String(err || "Kesalahan tidak diketahui");
          console.error("Error fetching data:", err);
          triggerToast(`Gagal terhubung ke Google Apps Script: ${message}`);
        }
      };
     const handleAddAsset = async (newAsset) => {
        // 1. Update UI secara lokal terlebih dahulu (Optimistic Update)
        const updated = [newAsset, ...assets];
        setAssets(updated);
        
        // 2. Jika koneksi GAS aktif, kirim data ke Google Sheets
        if (isGasActive) {
          triggerToast("Menyimpan ke Spreadsheet...");
          try {
            // Panggil fungsi sendToGAS dengan action 'addOrUpdateAsset'
            const res = await sendToGAS("addOrUpdateAsset", { assetData: newAsset });
            
            if (res && (res.status === "success" || res.success)) {
              triggerToast("✓ Aset tersinkronisasi ke Spreadsheet.");
              // Jika Anda ingin reload data terbaru dari Spreadsheet
              fetchSpreadsheetData(); 
            } else {
              triggerToast("⚠️ Aset tersimpan lokal, gagal sinkron ke Spreadsheet.");
            }
          } catch (error) {
            console.error("Gagal sinkronisasi aset ke GAS:", error);
            triggerToast("⚠️ Terjadi kesalahan saat menghubungkan ke Spreadsheet.");
          }
        } else {
          triggerToast("Aset baru terdaftar secara lokal (Offline).");
        }
      };

    const handleUpdateAsset = async (updatedAsset) => {
        // 1. Update UI secara lokal terlebih dahulu (Optimistic UI Update)
        const updated = assets.map(a => a.id === updatedAsset.id ? updatedAsset : a);
        setAssets(updated);
        
        // 2. Jika koneksi GAS aktif, kirim data pembaruan ke Google Sheets
        if (isGasActive) {
          triggerToast("Memperbarui data di Spreadsheet...");
          try {
            // Panggil fungsi sendToGAS dengan action 'addOrUpdateAsset'
            const res = await sendToGAS("addOrUpdateAsset", { assetData: updatedAsset });
            
            if (res && (res.status === "success" || res.success)) {
              triggerToast("✓ Pembaruan tersinkron ke Spreadsheet.");
              fetchSpreadsheetData();
            } else {
              triggerToast("⚠️ Terubah di lokal, gagal sinkron ke Spreadsheet.");
            }
          } catch (error) {
            console.error("Gagal sinkronisasi update ke GAS:", error);
            triggerToast("⚠️ Terjadi kesalahan saat memperbarui ke Spreadsheet.");
          }
        } else {
          triggerToast("Data aset diperbarui secara lokal (Offline).");
        }
      };

     const handleConfirmDeleteAsset = (id) => {
        setConfirmDialog({
          isOpen: true,
          title: "Hapus Master Aset",
          message: "Apakah Anda yakin ingin menghapus aset ini dari database utama? Tindakan ini tidak dapat dibatalkan.",
          onConfirm: async () => {
            // 1. Hapus dari UI lokal (Optimistic UI Update)
            setAssets(prevAssets => prevAssets.filter(a => a.id !== id));
            setConfirmDialog(p => ({ ...p, isOpen: false }));
            
            // 2. Jika koneksi GAS aktif, kirim perintah hapus ke Google Sheets
            if (isGasActive) {
              triggerToast("Menghapus dari Spreadsheet...");
              try {
                // Sesuai dengan switch-case: action 'deleteAsset' dan payload { id }
                const res = await sendToGAS("deleteAsset", { id: id });
                
                if (res && (res.status === "success" || res.success || !res.error)) {
                  triggerToast("✓ Penghapusan tersinkron ke Spreadsheet.");
                  fetchSpreadsheetData();
                } else {
                  triggerToast(`⚠️ Gagal hapus di Spreadsheet: ${res.error || 'Unknown error'}`);
                }
              } catch (error) {
                console.error("Gagal sinkronisasi hapus ke GAS:", error);
                triggerToast("⚠️ Terjadi kesalahan saat menghapus di Spreadsheet.");
              }
            } else {
              triggerToast("Aset dihapus secara lokal (Offline).");
            }
          }
        });
      };

      const handleAddSOItem = async (itemPayload) => {
        const existingIdx = activeSO.findIndex(x => x.kodeBarang === itemPayload.barcode && x.lokasi === itemPayload.lokasi);
        let updatedSO = [...activeSO];
        const timestamp = new Date().toLocaleString("id-ID");
        if (existingIdx !== -1) {
          updatedSO[existingIdx] = {
            ...updatedSO[existingIdx],
            qty: updatedSO[existingIdx].qty + itemPayload.qty,
            waktuInput: timestamp
          };
          triggerToast(`Kuantitas ${itemPayload.namaAset} bertambah.`);
        } else {
          updatedSO.unshift({
            id: `so-${Date.now()}`,
            kodeBarang: itemPayload.barcode,
            namaBarang: itemPayload.namaAset,
            lokasi: itemPayload.lokasi,
            qty: itemPayload.qty,
            waktuInput: timestamp
          });
          triggerToast(`${itemPayload.namaAset} ditambahkan ke draf.`);
        }
        setActiveSO(updatedSO);

      if (isGasActive) {
          try {
            // Mengirim data SO ke Google Apps Script
            const res = await sendToGAS("addSOItem", { data: updatedSO });
            
            if (res && res.error) {
              console.error("Gagal menyimpan SO ke GAS:", res.error);
              triggerToast("⚠️ Gagal menyimpan ke Spreadsheet.");
            } else {
              triggerToast("✓ Data SO tersimpan.");
            }
          } catch (error) {
            console.error("Gagal sinkronisasi Stock Opname:", error);
            triggerToast("⚠️ Terjadi kesalahan koneksi.");
          }
        }
      };

      const handleUpdateSOItem = async (id, newQty, newLokasi) => {
        const updated = activeSO.map(item => item.id === id ? { ...item, qty: newQty, lokasi: newLokasi, waktuInput: new Date().toLocaleString("id-ID") } : item);
        setActiveSO(updated);
        if (isGasActive) {
          try {
            const res = await sendToGAS("addSOItem", { data: updated });
            
            if (res && res.error) {
              console.error("Gagal update SO ke Spreadsheet:", res.error);
              triggerToast("⚠️ Gagal memperbarui Stock Opname.");
            } else {
              // Jika berhasil (opsional)
              triggerToast("✓ Stock Opname diperbarui.");
            }
          } catch (error) {
            console.error("Gagal sinkronisasi SO:", error);
            triggerToast("⚠️ Terjadi kesalahan koneksi.");
          }
        }
      };

      const handleDeleteSOItem = (id) => {
        const updated = activeSO.filter(item => item.id !== id);
        setActiveSO(updated);
        triggerToast("Item dihapus dari draf.");
       if (isGasActive) {
          try {
            // Mengirim data SO yang diperbarui ke GAS via action addSOItem atau updateSOItem
            sendToGAS("addSOItem", { data: updated })
              .then((res) => {
                if (res && res.error) {
                  console.error("Gagal update SO ke Spreadsheet:", res.error);
                }
              })
              .catch((err) => console.error("Error koneksi update SO:", err));
          } catch (error) {
            console.error("Gagal sinkronisasi SO:", error);
          }
        }
      };

      const handleSaveSODraft = async () => {
        if (isGasActive) {
          triggerToast("Mencadangkan draf ke Spreadsheet...");
          try {
            const res = await sendToGAS("addSOItem", { data: activeSO });
            if (res && !res.error) {
              triggerToast("✓ Draf berhasil dicadangkan ke Spreadsheet.");
            } else {
              triggerToast("⚠️ Gagal mencadangkan draf ke Spreadsheet.");
            }
          } catch (error) {
            console.error("Gagal cadangkan draf SO:", error);
            triggerToast("⚠️ Terjadi kesalahan koneksi ke Spreadsheet.");
          }
        } else {
          triggerToast("Draf berhasil dicadangkan lokal.");
        }
      };

      const handleOpenConfirmCompleteSO = (periode, lokasi) => {
        setConfirmDialog({
          isOpen: true,
          title: "Selesaikan Stock Opname?",
          message: `Arsipkan ${activeSO.length} item untuk periode ${periode} di ${lokasi}? Sesi draf aktif akan dibersihkan.`,
          onConfirm: async () => {
            const finishedDate = new Date().toLocaleString("id-ID");
            const fileDate = finishedDate.replace(/[\/\s:]/g, "");
            const totalQty = activeSO.reduce((s, x) => s + x.qty, 0);
            const newRecord = {
              id: `cso-${Date.now()}`,
              periode,
              tanggalSelesai: finishedDate,
              lokasi,
              namaFileExcel: `SO_${fileDate}.xlsx`,
              jumlahItem: activeSO.length,
              totalQty,
              items: [...activeSO]
            };

            // Trigger local Excel download
            let excelRows = (activeSO || []).map((item, index) => `
              <tr>
                <td>${index + 1}</td>
                <td style="mso-number-format:'\\@'; font-family:Consolas, monospace;">${item.kodeBarang}</td>
                <td>${item.namaBarang}</td>
                <td>${item.lokasi}</td>
                <td style="font-weight:bold; color:#1e40af;">${item.qty}</td>
                <td style="font-family:Consolas, monospace;">${item.waktuInput}</td>
              </tr>
            `).join('');

            const excelHtml = `
              <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
              <head><meta charset="utf-8" />
              <style>
                table { border-collapse: collapse; width: 100%; }
                td, th { border: 1px solid #dddddd; padding: 8px; font-family: 'Segoe UI', sans-serif; text-align: left; }
                th { background-color: #1e5574; color: #ffffff; font-weight: bold; }
                tr:nth-child(even) { background-color: #f8fafc; }
                h2 { font-family: 'Segoe UI', sans-serif; color: #2563eb; }
                p { font-family: 'Segoe UI', sans-serif; font-size: 12px; color: #475569; }
              </style>
              </head>
              <body>
                <h2>Audit Laporan Stock Opname: ${periode}</h2>
                <p>Lokasi Audit: ${lokasi}</p>
                <p>Tanggal Cetak: ${finishedDate}</p>
                <table>
                  <thead>
                    <tr><th>No</th><th>Kode / Barcode</th><th>Nama Barang</th><th>Lokasi Audit</th><th>Qty Fisik</th><th>Waktu Input</th></tr>
                  </thead>
                  <tbody>${excelRows}</tbody>
                </table>
              </body>
              </html>
            `;
            const blob = new Blob([excelHtml], { type: "application/vnd.ms-excel" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = newRecord.namaFileExcel;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);

            // Update local state
            setCompletedSO([newRecord, ...completedSO]);
            setActiveSO([]);
            setConfirmDialog(p => ({ ...p, isOpen: false }));
            triggerToast("Laporan stock opname dirilis.");

           if (isGasActive) {
              triggerToast("Menyimpan laporan ke Spreadsheet...");
              try {
                // Sesuai dengan switch-case di code.gs Anda: 'releaseSOReport'
                const res = await sendToGAS("releaseSOReport", { data: newRecord });

                if (res && (res.status === "success" || res.success || !res.error)) {
                  triggerToast("✓ Laporan tersimpan di Spreadsheet.");
                  fetchSpreadsheetData();
                } else {
                  triggerToast(`⚠️ Gagal simpan laporan: ${res.error || 'Unknown error'}`);
                }
              } catch (error) {
                console.error("Gagal simpan laporan SO ke GAS:", error);
                triggerToast("⚠️ Terjadi kesalahan koneksi saat menyimpan laporan.");
              }
            } else {
              triggerToast("Laporan tersimpan secara lokal (Offline).");
            }
          }
        });
      };

      const handleUpdateCompletedSO = async (id, newPeriode, newLokasi) => {
        const updated = completedSO.map(so => so.id === id ? { ...so, periode: newPeriode, lokasi: newLokasi } : so);
        setCompletedSO(updated);
        triggerToast("Arsip diperbarui.");
       if (isGasActive) {
          try {
            // Sesuai switch-case di code.gs Anda: action 'updateSOItem'
            const res = await sendToGAS("updateCompletedSO", {
              id,
              periode: newPeriode,
              lokasi: newLokasi
            });

            if (res && (res.status === "success" || res.success || !res.error)) {
              fetchSpreadsheetData();
            } else {
              console.error("Gagal update SO di Spreadsheet:", res.error);
            }
          } catch (error) {
            console.error("Gagal sinkronisasi update SO ke GAS:", error);
          }
        }
      };

      const handleDeleteCompletedSO = (id) => {
        setConfirmDialog({
          isOpen: true,
          title: "Hapus Arsip Laporan",
          message: "Apakah Anda yakin ingin menghapus laporan ini? Seluruh data riwayat detail laporan ini akan ikut terhapus.",
          onConfirm: async () => {
            setCompletedSO(completedSO.filter(so => so.id !== id));
            setConfirmDialog(p => ({ ...p, isOpen: false }));
            triggerToast("Arsip laporan dihapus.");
            if (isGasActive) {
              triggerToast("Menghapus arsip dari Spreadsheet...");
              try {
                // Sesuai dengan switch-case di code.gs Anda: action 'deleteSOItem'
                const res = await sendToGAS("deleteCompletedSO", { id: id });

                if (res && (res.status === "success" || res.success || !res.error)) {
                  triggerToast("✓ Arsip berhasil dihapus permanen.");
                  fetchSpreadsheetData();
                } else {
                  triggerToast(`⚠️ Gagal hapus di Spreadsheet: ${res.error || 'Unknown error'}`);
                }
              } catch (error) {
                console.error("Gagal sinkronisasi hapus arsip SO ke GAS:", error);
                triggerToast("⚠️ Terjadi kesalahan koneksi saat menghapus arsip.");
              }
            } else {
              triggerToast("Arsip dihapus secara lokal (Offline).");
            }
          }
        });
      };

      return (
        <div className="flex h-full w-full overflow-hidden bg-[#07111f]">
          <Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            isAdminLoggedIn={isAdminLoggedIn}
            onLogoutClick={() => { setIsAdminLoggedIn(false); setActiveTab("dashboard"); triggerToast("Logout sesi admin."); }}
            onOpenLoginModal={() => setIsLoginOpen(true)}
            adminSubTab={adminSubTab}
            setAdminSubTab={setAdminSubTab}
            isAdminMenuExpanded={isAdminMenuExpanded}
            setIsAdminMenuExpanded={setIsAdminMenuExpanded}
            isMobileOpen={isMobileOpen}
            onCloseMobile={() => setIsMobileOpen(false)}
          />

          <div className="flex-1 flex flex-col h-full overflow-hidden">
            <Navbar 
              activeTab={activeTab} 
              adminSubTab={adminSubTab} 
              isGasActive={isGasActive} 
              onToggleMobileMenu={() => setIsMobileOpen(!isMobileOpen)} 
            />

            <main className="flex-1 overflow-y-auto bg-[#07111f] relative">
              <div className={`fade-enter ${activeTab === "dashboard" ? "fade-enter-active" : "hidden"}`}>
                <DashboardView assets={assets} activeSO={activeSO} onNavigateToTab={setActiveTab} isAdminLoggedIn={isAdminLoggedIn} onOpenLoginModal={() => setIsLoginOpen(true)} />
              </div>
              <div className={`fade-enter ${activeTab === "stock-opname" ? "fade-enter-active" : "hidden"}`}>
                <StockOpnameView
                  assets={assets}
                  importedItems={importedItems}
                  activeSO={activeSO}
                  onAddSOItem={handleAddSOItem}
                  onDeleteSOItem={handleDeleteSOItem}
                  triggerToast={triggerToast}
                  isActive={activeTab === "stock-opname"}
                />
              </div>
              <div className={`fade-enter ${activeTab === "scan-cek" ? "fade-enter-active" : "hidden"}`}>
                <ScanCekAsetView assets={assets} isActive={activeTab === "scan-cek"} triggerToast={triggerToast} />
              </div>
              <div className={`fade-enter ${activeTab === "admin-data" ? "fade-enter-active" : "hidden"}`}>
                <AdminDataView
                  assets={assets} onAddAsset={handleAddAsset} onUpdateAsset={handleUpdateAsset} onConfirmDeleteAsset={handleConfirmDeleteAsset}
                  activeSO={activeSO} onOpenConfirmCompleteSO={handleOpenConfirmCompleteSO} onUpdateSOItem={handleUpdateSOItem} onDeleteSOItem={handleDeleteSOItem}
                  completedSO={completedSO} onUpdateCompletedSO={handleUpdateCompletedSO} onDeleteCompletedSO={handleDeleteCompletedSO}
                  adminSubTab={adminSubTab} setAdminSubTab={setAdminSubTab} sheetUrl={sheetUrl} triggerToast={triggerToast} onSaveSODraft={handleSaveSODraft}
                  importedItems={importedItems} setImportedItems={setImportedItems}
                  importedFileName={importedFileName} setImportedFileName={setImportedFileName}
                  finalSORecords={finalSORecords} setFinalSORecords={setFinalSORecords}
                />
              </div>
              <footer className="w-full text-center py-5 text-slate-500 text-[10px] font-mono tracking-wider border-t border-[#1e5574]/30 bg-[#0d2135]/30 select-none mt-12">
                                2026 DWI SYAFITRI. all right reserved &bull; 
                             hub : 088289369002
              </footer>
            </main>
          </div>

          <LoginModal isOpen={isLoginOpen} onClose={() => setIsLoginOpen(false)} onLoginSuccess={() => { setIsAdminLoggedIn(true); setActiveTab("admin-data"); triggerToast("Login admin berhasil!"); }} />
          <ConfirmDialog isOpen={confirmDialog.isOpen} title={confirmDialog.title} message={confirmDialog.message} onConfirm={confirmDialog.onConfirm} onCancel={() => setConfirmDialog(p => ({ ...p, isOpen: false }))} />

          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#12324b] border border-blue-500/20 px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce">
              <div className="h-6 w-6 bg-blue-500/10 text-blue-400 rounded-lg flex items-center justify-center"><Icon name="bell" className="h-4 w-4" /></div>
              <span className="text-xs font-bold text-slate-200">{toast}</span>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
